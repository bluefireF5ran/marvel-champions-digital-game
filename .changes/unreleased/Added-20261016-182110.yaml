kind: Added
body: 'Desktop app: Settings > Display > Window picks Windowed, Borderless or Fullscreen and, from a dropdown with Apply, a resolution (Native by default). On Windows, Fullscreen really switches the monitor to one of its own display modes and puts yours back when you leave Fullscreen, switch away, quit or crash; elsewhere the game draws at that resolution and scales to fit with black bars. SteamOS and Bazzite start in Fullscreen at native, with a Steam Deck row to return to it.'
