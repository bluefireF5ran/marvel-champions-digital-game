kind: Added
body: 'The Android app notices power saving mode: while it is on, the game turns on reduced motion, draws text at 1x and caps the frame rate at 30 fps (unless you set those yourself), and says so in a notice, on the title screen and in Settings. Settings > Display > Lighter play in power saving turns it off (#249).'
