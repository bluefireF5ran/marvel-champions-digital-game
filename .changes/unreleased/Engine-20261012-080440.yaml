body: 'A maximum on the cards tucked under a card (`tuckLimit`, Ionic Physiology''s "Max 3 cards tucked here"): a tuck takes only the cards there is room for, a full card refuses the tuck and skips the text after its "Then", and an ability that only tucks there is not offered'
