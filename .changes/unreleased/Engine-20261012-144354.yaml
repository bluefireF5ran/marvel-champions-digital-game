kind: Engine
body: A cost can be reduced to 0 for a player's next matching card (`reduceNextCardCost(player, "toZero", …)`), and a reduction can be bound to the cards a search found, following each card until its next play (`reduceCostOfCards`; hero packs HT8, HT9)
