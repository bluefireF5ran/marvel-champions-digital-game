kind: Engine
body: A "deal N damage to a character" cost (Thwip Thwip!, Quick Quip, Spider-Tingle, Clarity of Purpose) now counts as paid even when Toughness, a tough status card or a prevention or reduction effect stops the damage (RRG v1.8 p.14; rulings June 25 and July 9, 2026).
