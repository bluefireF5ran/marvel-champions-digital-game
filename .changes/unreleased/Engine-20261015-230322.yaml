kind: Engine
body: Peril now stops other players from triggering optional interrupts and responses, including (defense) events, while a player resolves a peril card, and from triggering abilities on a peril card in another player's area; forced abilities still resolve (RRG v1.8 p.32; ruling July 9, 2026 R3).
