kind: Engine
body: A stunned character that cannot attack at all (for example Vision in Intangible form) can no longer use a basic attack attempt to remove its stun, and "you cannot make basic attacks" is now always found when other attack prohibitions are in play (FFG ruling Jan 18, 2023; RRG v1.8 p.11).
