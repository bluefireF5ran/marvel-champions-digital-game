kind: Engine
body: 'Each ally a query matches can be treated as a minion while it matches (treatAsMinion: Baron Zemo''s ''each ally with threat on it''), with SCH equal to its base THW; it is an ally again under its owner''s control, keeping its threat, once the query stops matching or the card leaves play or is blanked.'
