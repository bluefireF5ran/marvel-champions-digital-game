kind: Engine
body: 'Villainous works for allies and heroes (RRG 1.8 p. 47; MC60 p. 26 FAQ, Black Cat 60169): a basic power is given a facedown boost card, turned faceup as the power resolves and heard by unqualified ''boost card turned faceup'' cards; its Boost resolves for its controller, its icons go to the stat used (following any swap), and it is discarded once the power has resolved. An ally''s defense gets no card.'
