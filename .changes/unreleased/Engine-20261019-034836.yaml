kind: Engine
body: 'A When Defeated or When Revealed ability a card gains now resolves: game-triggered abilities read the card''s live abilities, printed and gained, so a blank text box keeps a gained one and an ignore-When-Defeated effect stops it (RRG 1.8 ''Gains'', p. 21).'
