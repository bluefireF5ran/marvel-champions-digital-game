body: Surge and incite count as When Revealed abilities when a card resolves another card's When Revealed, and the first player orders incite, printed When Revealed and surge on a reveal (FFG ruling Sep 22, 2026; Change of Venue and Countless Numbers' boosts excepted pending erratum).
