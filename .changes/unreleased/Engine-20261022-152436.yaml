kind: Engine
body: A set-aside villain card can be put into play as an Elite minion by the card attached to it, keeping its own text; when that card leaves it stays in play as a villain, a two-sided villain card discarded as a minion is removed from the game, and finding a villain searches every deck and discard pile or reveals one already in play.
