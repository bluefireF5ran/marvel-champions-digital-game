kind: Engine
body: 'A "prevent all damage from this attack" on an attack with several targets prevents only the damage to the character it protects: Attacrobatics and Night Vision Goggles against Spray Fire still let the engaged minions take theirs, and Attacrobatics'' expert clause deals the damage prevented on Black Widow. The protected character is the one the attack was against when the prevention resolved: an attack moved afterwards deals its damage to its new target'
