kind: Engine
body: With several villains, a permanent encounter attachment on the defeated active villain (Flight in Four Horsemen or The Wrecking Crew) now waits for the active counter to pass and attaches to the new active villain, instead of being removed from the game; a villain that leaves play without being defeated, or one in a separate villain area, does not make it wait (#525 item 8).
