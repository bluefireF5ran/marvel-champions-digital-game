body: 'A scheme with no threat is not a target for a thwart or a removal of threat (RRG 1.8 "Target", p. 42): a card that only removes threat (For Justice!, Feline Senses, Precinct HQ) cannot be played or used while no scheme holds any, and a scheme with none is not offered'
