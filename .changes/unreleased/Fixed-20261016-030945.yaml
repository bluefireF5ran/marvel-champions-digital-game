kind: Fixed
body: 'An "after [enemy] attacks and damages" or "attacks and defeats" ability now resolves once for each character the attack damages or defeats, so overkill damage spilled onto an identity or villain triggers it again (Jigsaw, Toad, Cypher, Captain Marvel; ruling January 11, 2026 (2), RRG p. 31)'
