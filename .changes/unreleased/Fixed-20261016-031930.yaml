kind: Fixed
body: '"Attacks and damages you" (Green Goblin, Tombstone, the Sinister Six, Beetle, Gamora, Space Pirates, Power Gauntlets, Ionic Boots) now need your identity damaged, not a defending ally, "You''ll Pay for That!" counts only your identity''s damage and is not offered when your identity took none, and Defiance cannot be played while your ally defends (RRG p. 43, p. 49; FFG rulings Jul 18, 2024 and Mar 15, 2024)'
