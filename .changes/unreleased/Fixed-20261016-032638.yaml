body: 'Bulldozer''s Helmet resolves once per attack and discards 1 card per point of damage the whole attack dealt, overkill onto your hero included; Major Domo and Head of Steam count overkill damage too (RRG 1.8 p. 31, p. 49; ruling Jan 11, 2026 (2))'
