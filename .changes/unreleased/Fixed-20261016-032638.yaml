kind: Fixed
body: 'Bulldozer''s Helmet resolves once per attack and discards 1 card per point of damage the whole attack dealt, overkill onto your hero included; Major Domo and Head of Steam count overkill damage too, and all three count damage a tough status card stopped, since it was dealt (RRG 1.8 p. 14, p. 31, p. 49; rulings Jan 11, 2026 (2) and Jan 17, 2026 (3))'
