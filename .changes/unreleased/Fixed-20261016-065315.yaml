kind: Fixed
body: 'An alter-ego is no longer "the character with the highest ATK" (Restrained), whether the card attaches to it or targets it: an alter-ego has no ATK, THW or DEF and a hero no REC (ruling April 17, 2025). Allies, minions and villains are still ranked by every stat'
