body: 'With several main schemes in play (Venom Goblin), Cable, Montage and the Venom ally count the main scheme best for their controller each time, as the player may choose it (RRG 1.8 p. 63; FFG rulings of Dec 22, 2023 and May 16, 2024). In Tower Defense the Venom ally now reads the scheme with Focused Defense, as a player card''s constant does (MC21 p. 10)'
