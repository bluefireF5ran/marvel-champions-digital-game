kind: Fixed
body: 'Refilling to hand size draws one card at a time: a drawn card''s "after this enters your hand" ability (Shapeshifter Surprise) or a drawn obligation entering play resolves before the next card is drawn, and Mysterio''s encounter cards are still dealt after the whole draw (RRG p. 21; ruling Aug 14, 2025)'
