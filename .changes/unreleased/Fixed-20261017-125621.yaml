body: "Domino: a card discarded from the top of her deck still counts for the card that discarded it after its response moves it, so Jackpot! shuffled back gives Luck Be a Lady, A Good Workout and the rest its three icons (Digging Deep, White Fox and The Painted Lady likewise; Age of Apocalypse mission attempts keep FFG's ruling and warn). The response sheet names what discarded the card (#222)."
