kind: Fixed
body: 'The card ingest numbers an infinite-hit-point back face of a single-stage villain as stage 2 (FFG ruling Sep 5, 2024: the printed numeral), so Hela''s Wounded faces keep their fix and The Collector''s and the Loki Avatars'' back faces read stage 2.'
