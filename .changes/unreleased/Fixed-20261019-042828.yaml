body: Effects where each player picks from a shared pile (Zola, Hydra Patrol, Kingpin's Underlings, The Raft's Prisoners, set-aside allies and upgrades, and others) now let the first player choose the order players resolve in (RRG 1.8 'Each Player', p. 17).
