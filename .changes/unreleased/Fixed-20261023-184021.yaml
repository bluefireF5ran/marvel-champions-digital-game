kind: Fixed
body: On a narrow phone, an interrupt window during a villain attack (Backflip) no longer cuts the damage total off the attack's breakdown; a cut line now leads with it ("DAMAGE 3 = BASE 2 + …"), the window's tags stack instead of running off the panel, and a green stamp on the window says how much damage the interrupt prevents ("PREVENTS 2 DAMAGE"), with the hero's hit points now and if it resolves (#394, reported by @zackburnley).
