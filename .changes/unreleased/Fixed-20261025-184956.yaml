kind: Fixed
body: An enemy activation started while another enemy activation resolves now waits for it to finish, whatever started it (a response or a forced response as well as a Boost ability), and keeps its player and event scope; a replacement activation still resolves at once (RRG 1.8 p. 6, ruling 214)
