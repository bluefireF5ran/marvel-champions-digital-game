kind: Fixed
body: 'Ten more encounter attachments now give their printed stat boxes, which were missing: Blackjack''s Bazooka, Drang''s Spear, Universal Weapon, Cloak of Hercules, Challenge Accepted, Corvus''s Glaive, Lethal Weapon, Humongous Hallucination, Masterful Mirage, Cyborg Tech and Pull of Power, and the SCH/THW attachments in Fear No Evil now count for THW on a hero (#678).'
