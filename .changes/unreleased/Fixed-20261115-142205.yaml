body: 'Old Rivals: once "when Gamora attacks" abilities resolve, the attacked player may declare a defender against her attack (Gamora herself included) or use a defense card; "after you defend" abilities answer that defense, while abilities that need an enemy (Counter-Punch, True Grit, Excelsior, "the attacking enemy", Iceman''s Freeze!) do not, since she is not one; the defend panel shows no boost card count for her attack, which has none'
