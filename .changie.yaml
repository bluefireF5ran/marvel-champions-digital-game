changesDir: .changes
unreleasedDir: unreleased
headerPath: header.tpl.md
changelogPath: CHANGELOG.md
versionExt: md
versionFormat: '## [{{.Version}}] - {{.Time.Format "2006-01-02"}}'
kindFormat: "### {{.Kind}}"
changeFormat: "* {{.Body}}"
kinds:
  - label: Added
    auto: minor
  - label: Changed
    auto: minor
  - label: Fixed
    auto: patch
  - label: Engine
    auto: patch
  - label: Content
    auto: patch
  - label: Docs
    auto: patch
newlines:
  afterChangelogHeader: 1
  beforeChangelogVersion: 1
  endOfVersion: 1
envPrefix: CHANGIE_
replacements:
  - path: package.json
    find: '  "version": ".*"'
    replace: '  "version": "{{.VersionNoPrefix}}"'
  - path: packages/client/src-tauri/tauri.conf.json
    find: '  "version": ".*"'
    replace: '  "version": "{{.VersionNoPrefix}}"'
  - path: packages/client/src-tauri/Cargo.toml
    find: '^version = ".*"'
    replace: 'version = "{{.VersionNoPrefix}}"'
  - path: packages/client/android/app/build.gradle
    find: '        versionName ".*"'
    replace: '        versionName "{{.VersionNoPrefix}}"'
  - path: packages/engine/src/index.ts
    find: 'export const ENGINE_VERSION = ".*";'
    replace: 'export const ENGINE_VERSION = "{{.VersionNoPrefix}}";'
  - path: packages/client/src/version.ts
    find: 'export const CLIENT_VERSION = ".*";'
    replace: 'export const CLIENT_VERSION = "{{.VersionNoPrefix}}";'
  - path: packages/content/src/index.ts
    find: 'export const SCHEMA_VERSION = ".*";'
    replace: 'export const SCHEMA_VERSION = "{{.VersionNoPrefix}}";'
  # The README's version badge and the release it links to.
  - path: README.md
    find: 'badge/version-v[0-9]+\.[0-9]+\.[0-9]+-'
    replace: "badge/version-{{.Version}}-"
  - path: README.md
    find: 'releases/tag/v[0-9]+\.[0-9]+\.[0-9]+\)'
    replace: "releases/tag/{{.Version}})"
  # The README's download buttons: each link names the release's files, and each button shows its version.
  - path: README.md
    # The top buttons are the English downloads; names carry `-EN-` from the first release with Spanish builds (#337).
    # The OS has to follow, so the Spanish buttons' `-ES-` names don't match and become `-EN-ES-`.
    find: 'releases/download/v[0-9]+\.[0-9]+\.[0-9]+/MarvelChampions-[0-9]+\.[0-9]+\.[0-9]+-(EN-)?(Windows|macOS|Linux|Android)'
    replace: "releases/download/{{.Version}}/MarvelChampions-{{.VersionNoPrefix}}-EN-$2"
  - path: README.md
    # The Spanish buttons, in the README's folded Spanish installs section.
    find: 'releases/download/v[0-9]+\.[0-9]+\.[0-9]+/MarvelChampions-[0-9]+\.[0-9]+\.[0-9]+-ES-'
    replace: "releases/download/{{.Version}}/MarvelChampions-{{.VersionNoPrefix}}-ES-"
  - path: .github/assets/readme/download-windows.svg
    find: 'v[0-9]+\.[0-9]+\.[0-9]+'
    replace: "{{.Version}}"
  - path: .github/assets/readme/download-macos-apple-silicon.svg
    find: 'v[0-9]+\.[0-9]+\.[0-9]+'
    replace: "{{.Version}}"
  - path: .github/assets/readme/download-macos-intel.svg
    find: 'v[0-9]+\.[0-9]+\.[0-9]+'
    replace: "{{.Version}}"
  - path: .github/assets/readme/download-linux.svg
    find: 'v[0-9]+\.[0-9]+\.[0-9]+'
    replace: "{{.Version}}"
  - path: .github/assets/readme/download-android.svg
    find: 'v[0-9]+\.[0-9]+\.[0-9]+'
    replace: "{{.Version}}"
  - path: .github/assets/readme/download-windows-es.svg
    find: 'v[0-9]+\.[0-9]+\.[0-9]+'
    replace: "{{.Version}}"
  - path: .github/assets/readme/download-macos-apple-silicon-es.svg
    find: 'v[0-9]+\.[0-9]+\.[0-9]+'
    replace: "{{.Version}}"
  - path: .github/assets/readme/download-macos-intel-es.svg
    find: 'v[0-9]+\.[0-9]+\.[0-9]+'
    replace: "{{.Version}}"
  - path: .github/assets/readme/download-linux-es.svg
    find: 'v[0-9]+\.[0-9]+\.[0-9]+'
    replace: "{{.Version}}"
  - path: .github/assets/readme/download-android-es.svg
    find: 'v[0-9]+\.[0-9]+\.[0-9]+'
    replace: "{{.Version}}"
