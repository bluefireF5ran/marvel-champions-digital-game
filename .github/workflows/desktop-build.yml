# Desktop builds for macOS, Linux and Windows 11.
#
# Tauri bundles with the host's own toolchain (Xcode, webkit2gtk, MSVC +
# WebView2), so one machine cannot produce all three: each OS builds its own.
# `bundle.targets: "all"` in src-tauri/tauri.conf.json then yields
#   macOS    .app + .dmg, one per architecture (Apple silicon, Intel)
#   Linux    .deb, .rpm and .AppImage (x86_64)
#   Windows  .msi and an NSIS -setup.exe (x64). Windows 11 ships WebView2, and
#            the installer fetches it on the rare machine that lacks it.
#
# Run it by hand from the Actions tab to get the installers as workflow
# artifacts, or push a `v*` tag to also attach them to a draft GitHub release.
#
# The macOS bundle is signed and notarized when the APPLE_* secrets are set
# (README, "macOS signing"); without them it is unsigned and Gatekeeper blocks
# it. Windows is not signed yet, so SmartScreen warns once.
name: Desktop build

# Trigger manually from GitHub Actions tab for standalone desktop verification.
# Automated releases and tag cutting are handled by release-on-merge.yml.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The same gate release-on-merge.yml runs before its builds, once, instead of
  # once per OS: a red suite never ships an installer. Lint and format here, and
  # the typecheck and unit tests in parallel in the tests stage (tests.yml).
  checks:
    name: Checks (lint, format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm fmt:check

  tests:
    name: Tests
    uses: ./.github/workflows/tests.yml

  build:
    name: ${{ matrix.name }}
    needs: [checks, tests]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One build per architecture, not a universal binary: Tauri embeds the whole of `dist/` (card art and
          # music, over a gigabyte) in the executable, so a universal binary carries it twice and its .dmg passes
          # GitHub's 2 GiB limit on a release asset (v0.16.0).
          - name: macOS (Apple silicon)
            os: macos-latest
            artifact: macos-aarch64
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            artifact: macos-x64
            args: --target x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
          - name: Linux (x86_64)
            # The oldest supported Ubuntu, so the AppImage and .deb run on
            # older glibc too, not only on the newest distro.
            os: ubuntu-22.04
            artifact: linux-x64
            args: ""
            rust-targets: ""
          - name: Windows 11 (x64)
            os: windows-latest
            artifact: windows-x64
            args: ""
            rust-targets: ""

    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential curl wget file libssl-dev libxdo-dev

      # Reads the pnpm version from package.json's `packageManager`.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/client/src-tauri -> target
          # The two macOS builds share an OS but not a target, so each keeps its own cache.
          key: ${{ matrix.artifact }}

      - run: pnpm install --frozen-lockfile

      # Signs and notarizes the macOS bundle once the Apple secrets exist (see
      # README, "macOS signing"). Only the secrets that are set are exported:
      # Tauri treats an empty APPLE_CERTIFICATE or APPLE_ID as present and
      # fails, so with no secrets the build stays unsigned, as before.
      - name: macOS signing secrets
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!name}" ]; then
              delim="EOF_$(uuidgen)"
              { echo "$name<<$delim"; echo "${!name}"; echo "$delim"; } >> "$GITHUB_ENV"
              echo "$name is set"
            fi
          done

      # Names the certificate in the log (subject, issuer, expiry) and checks it
      # against APPLE_SIGNING_IDENTITY, so a wrong .p12 fails here with a reason
      # instead of as "failed to resolve signing identity". It also installs
      # Apple's Developer ID G2 intermediate, without which the runner cannot
      # validate a certificate exported without its chain.
      - name: macOS certificate check
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        run: |
          P12="$RUNNER_TEMP/cert.p12"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$P12"
          SUBJECT=$(/usr/bin/openssl pkcs12 -in "$P12" -clcerts -nokeys -passin env:APPLE_CERTIFICATE_PASSWORD \
            | /usr/bin/openssl x509 -noout -subject -issuer -enddate) || SUBJECT=""
          rm -f "$P12"
          if [ -z "$SUBJECT" ]; then
            echo "::error::APPLE_CERTIFICATE could not be read with APPLE_CERTIFICATE_PASSWORD."
            exit 1
          fi
          echo "$SUBJECT"
          case "$SUBJECT" in
            *"Developer ID Application:"*) ;;
            *) echo "::error::APPLE_CERTIFICATE is not a Developer ID Application certificate."; exit 1 ;;
          esac
          case "$SUBJECT" in
            *"$APPLE_SIGNING_IDENTITY"*) ;;
            *) echo "::error::APPLE_SIGNING_IDENTITY does not match the certificate's name (CN above)."; exit 1 ;;
          esac
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          sudo security add-certificates -k /Library/Keychains/System.keychain "$RUNNER_TEMP/DeveloperIDG2CA.cer" || true

      # Runs `pnpm build` (tauri.conf.json's beforeBuildCommand: the Vite build,
      # which copies the pool's card scans into dist/) and then bundles.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The production save-transfer Worker (save-data/transfer-config.ts); empty until the variable is set.
          VITE_SYNC_URL: >-
            ${{ (vars.CLOUDFLARE_WORKERS_SUBDOMAIN || secrets.CLOUDFLARE_WORKERS_SUBDOMAIN) && format('https://mc-sync.{0}.workers.dev',
            (vars.CLOUDFLARE_WORKERS_SUBDOMAIN || secrets.CLOUDFLARE_WORKERS_SUBDOMAIN)) || '' }}
        with:
          projectPath: packages/client
          args: ${{ matrix.args }}

      # The same names a release gives them (scripts/lib/release-collector.mjs).
      - name: Stage installers under their release names
        run: node scripts/stage-release-assets.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: marvel-champions-${{ matrix.artifact }}
          if-no-files-found: error
          path: release/*
