# End-to-end regression (`docs/guided-mode.md` §4 G11, `packages/client/e2e/`): the Playwright suite that drives the
# tutorial, the campaign and scenario smokes and the wave 6 screens through a real headless browser against the
# client's own Vite dev server.
#
# Dispatch-only since 2026-10-05 (the owner's call): it does not run on pull requests. The hosted runner (software
# WebGL, two workers) is several times slower than a laptop with a GPU, and specs that pass locally timed out here.
# The suite is required locally instead: the pre-push hook (`.githooks/pre-push`) runs it on what is being pushed.
# Run this workflow by hand to see how the suite behaves on a slow machine.
#
# It is split over four shards that each run a quarter of the tests with `--shard`. Each shard installs its own
# Chromium and uploads its own report.
name: e2e

on:
  workflow_dispatch:
    inputs:
      workers:
        description: "Playwright workers per shard (an experiment knob; the default is the config's)"
        required: false
        default: ""

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e (Chromium) · shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    # A ceiling for a hung run: a shard should finish in about 10-12 minutes.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch media assets
        uses: ./.github/actions/assets
        with:
          bundles: card-art music art
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @mc/client exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium
        id: chromium-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @mc/client exec playwright install --with-deps chromium
      - name: Install Chromium system libraries
        if: steps.chromium-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @mc/client exec playwright install-deps chromium
      - name: Run e2e (shard ${{ matrix.shard }} of ${{ strategy.job-total }})
        env:
          E2E_WORKERS: ${{ inputs.workers }}
        run: pnpm --filter @mc/client e2e --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: packages/client/playwright-report/
          retention-days: 14
