# Web deploys to Netlify, built here instead of on Netlify.
#
# Netlify's free plan caps build minutes, and a client build with ~450 MB of card art burns through them. Uploading
# an already-built `dist` with the Netlify CLI is not a Netlify build, so it costs no build minutes; Actions minutes
# are free for this public repo. Netlify dedupes uploads by file hash, so the card art only uploads when it changes.
#
#   push to main   -> production deploy (the live site)
#   pull request   -> preview deploy at https://pr-<number>--<site>.netlify.app, linked in a PR comment, and an
#                     Android preview APK (signed with the release key, so it installs over the store build) as the
#                     pre-release `android-preview-pr-<number>`, also linked in a PR comment
#
# Either way the tests stage (tests.yml: a typecheck and the unit tests, in parallel on their own runners) runs first,
# and the deploy job starts only once all of it passes. The deploy job itself only installs, builds the client and
# uploads it. Lint and format run beside the tests.
#
# "All checks" is the one check the branch ruleset requires. A ruleset can't match check names with a wildcard, and on
# a pull request the tests stage leaves out the unit-test jobs the changed files can't affect, so a required job such
# as "Tests / Unit tests (engine)" would wait forever. "All checks" reports on every run: it passes when lint and
# format, the tests stage (every job in it, whatever tests.yml grows) and the client build pass. The deploy itself
# isn't required.
#
# Needs two repository secrets: NETLIFY_AUTH_TOKEN (a Netlify personal access token) and NETLIFY_SITE_ID (the site's
# Project ID, under Project configuration -> General). Netlify's own builds stay off ("Stop builds" in the site's
# build settings); netlify.toml's redirects and headers still apply to these deploys.
# Named "CI" because the tests stage shows under this workflow's name: "CI / Tests / Unit tests (...)" runs the suite
# once, and "CI / Build and deploy to Netlify" waits for it and runs no tests itself.
name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: netlify-deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm fmt:check

  # Every YAML file (workflows, issue templates, changie config and fragments) through yamllint (.yamllint.yaml).
  yaml:
    name: YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uvx yamllint@1.38.0 --strict --format github .

  # Its own check, so a malformed changelog fragment (an unescaped quote in a single-quoted body, an unknown kind,
  # an empty body) shows by name on the pull request instead of breaking the release PR job after it reaches main.
  changelog:
    name: Changelog fragments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: miniscruff/changie-action@v3
        with:
          version: latest
          args: --version
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-changelog.mjs

  # Typecheck and the unit tests, in parallel (tests.yml). They need no secrets, so they run on fork PRs too.
  tests:
    name: Tests
    uses: ./.github/workflows/tests.yml

  deploy:
    name: Build and deploy to Netlify
    runs-on: ubuntu-latest
    # Runs no checks of its own: it waits for the tests stage, and a failure there deploys nothing.
    needs: tests
    outputs:
      # The gate needs the build to pass, not the deploy.
      build: ${{ steps.build.outcome }}
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      # A PR checkout is GitHub's merge commit; stamp the Title footer with the branch head instead (vite.config.ts).
      COMMIT_REF: ${{ github.event.pull_request.head.sha || github.sha }}
      # The save-transfer Worker the build talks to (save-data/transfer-config.ts): production on main, the staging
      # Worker on previews. Empty until CLOUDFLARE_WORKERS_SUBDOMAIN is set (a variable, or a secret); the game then
      # says online transfer is unavailable.
      VITE_SYNC_URL: >-
        ${{ (vars.CLOUDFLARE_WORKERS_SUBDOMAIN || secrets.CLOUDFLARE_WORKERS_SUBDOMAIN) && format('https://{0}.{1}.workers.dev',
        github.event_name == 'push' && 'mc-sync' || 'mc-sync-staging', (vars.CLOUDFLARE_WORKERS_SUBDOMAIN || secrets.CLOUDFLARE_WORKERS_SUBDOMAIN)) || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Each job is a fresh runner, so the install repeats; the pnpm store comes from the cache, so it takes seconds.
      - id: build
        run: pnpm --filter @mc/client build

      - name: Deploy
        id: deploy
        # Fork PRs get no secrets, so they build but can't deploy.
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::error::NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID repository secrets are required"
            exit 1
          fi
          if [ "${{ github.event_name }}" = "push" ]; then
            target=(--prod)
            message="main@${COMMIT_REF:0:7}"
          else
            target=(--alias "pr-${{ github.event.pull_request.number }}")
            message="PR #${{ github.event.pull_request.number }}@${COMMIT_REF:0:7}"
          fi
          # The CLI sees the pnpm workspace and needs the app named; --dir still resolves from the repo root.
          npx --yes netlify-cli@27.10.0 deploy --no-build --filter @mc/client --dir packages/client/dist "${target[@]}" \
            --message "$message" --json > deploy.json
          url=$(jq -r 'if .url and (env.GITHUB_EVENT_NAME == "push") then .url else .deploy_url end' deploy.json)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed $message to $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment the preview URL
        if: steps.deploy.outcome == 'success' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.url }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          marker="<!-- netlify-preview -->"
          body="$marker
          **Netlify preview:** $URL (built from ${COMMIT_REF:0:7})"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" > /dev/null
          fi

  # An APK of the pull request for testers on Android (#328), next to the Netlify preview. Signed with the release key so
  # it installs over the released app and keeps its saves. It goes up as the pre-release `android-preview-pr-<number>`,
  # replaced on every push and deleted when the pull request closes (android-preview-cleanup.yml); the in-app update
  # check skips pre-releases (platform/update-check.ts). Not required: the gate ignores its result.
  android-preview:
    name: Android preview APK
    runs-on: ubuntu-latest
    needs: tests
    # Fork PRs get no secrets, so there is no release key to sign with.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      pull-requests: write
    env:
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      TAG: android-preview-pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Accept the Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - run: pnpm install --frozen-lockfile

      # The release key only (release-on-merge.yml's Setup Keystore): an APK signed with any other key won't install
      # over the player's app.
      - name: Setup Keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.ANDROID_KEYSTORE_ALIAS || 'marvel-champions' }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::No release keystore secrets; skipping the Android preview."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > marvel-champions.keystore
          {
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            echo "ANDROID_KEYSTORE_ALIAS=$KEY_ALIAS"
          } >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Build the APK
        if: steps.keystore.outputs.ready == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/marvel-champions.keystore
          # A PR checkout is GitHub's merge commit; stamp the Title footer with the branch head instead (vite.config.ts).
          COMMIT_REF: ${{ github.event.pull_request.head.sha }}
          VITE_SYNC_URL: >-
            ${{ (vars.CLOUDFLARE_WORKERS_SUBDOMAIN || secrets.CLOUDFLARE_WORKERS_SUBDOMAIN) && format('https://mc-sync-staging.{0}.workers.dev',
            (vars.CLOUDFLARE_WORKERS_SUBDOMAIN || secrets.CLOUDFLARE_WORKERS_SUBDOMAIN)) || '' }}
        run: pnpm android:build

      - name: Publish the pre-release
        id: publish
        if: steps.keystore.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          built=$(find release -name "*-Android.apk" | head -n 1)
          if [ ! -f "$built" ]; then
            echo "::error::The signed APK was not found under release/."
            exit 1
          fi
          name="$(basename "$built" -Android.apk)-PR${PR}-${HEAD_SHA:0:7}-Android.apk"
          mv "$built" "$name"
          # Recreated on every push, so the tag sits on the commit the APK was built from.
          gh release delete "$TAG" --cleanup-tag --yes 2> /dev/null || true
          gh release create "$TAG" "$name" --prerelease --target "$HEAD_SHA"             --title "Android preview: PR #${PR}"             --notes "A test build of #${PR} at ${HEAD_SHA:0:7}, not a release. It installs over the released app and keeps its saves; the next release installs over it. Deleted when the pull request closes."
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${name}"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Android preview: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment the APK link
        if: steps.publish.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.publish.outputs.url }}
        run: |
          marker="<!-- android-preview -->"
          body="$marker
          **Android preview APK:** $URL (built from ${HEAD_SHA:0:7}; installs over the released app)"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate             --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" > /dev/null
          fi

  # The save-transfer Worker (packages/sync-worker, #276) on Cloudflare's free plan: production on a push to main,
  # the staging Worker (`--env staging`, what previews talk to) on a pull request. Its tests run in the tests stage.
  # Skips with a notice until the owner adds the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets
  # (CONTRIBUTING.md, "The save-transfer Worker"). Not required: the gate ignores its result.
  deploy-sync:
    name: Deploy the sync Worker
    runs-on: ubuntu-latest
    needs: tests
    # Fork PRs get no secrets.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    # The token goes only to the two steps that need it, so `pnpm install` and dependency scripts never see it.
    steps:
      - name: Check for Cloudflare secrets
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::No Cloudflare secrets yet; skipping the sync Worker deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.secrets.outputs.ready == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - if: steps.secrets.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - name: Deploy
        if: steps.secrets.outputs.ready == 'true'
        working-directory: packages/sync-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # `--env=""` names the top-level (production) config, which wrangler otherwise warns about.
          if [ "${{ github.event_name }}" = "push" ]; then
            pnpm exec wrangler deploy --env=""
          else
            pnpm exec wrangler deploy --env staging
          fi

  # A needed job's result covers every job inside it, so `tests` stands for the whole of tests.yml, matrix shards
  # included. The first step fails if a job is added to this file without being added to `needs`.
  gate:
    name: All checks
    needs: [lint, yaml, changelog, tests, deploy, android-preview, deploy-sync]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/workflows
      - name: Check that every job is gated
        run: |
          f=.github/workflows/netlify-deploy.yml
          jobs=$(yq -r '.jobs | keys | .[] | select(. != "gate")' "$f" | sort)
          needs=$(yq -r '.jobs.gate.needs[]' "$f" | sort)
          missing=$(comm -23 <(echo "$jobs") <(echo "$needs"))
          if [ -n "$missing" ]; then
            echo "::error::Add these jobs to the gate's needs in netlify-deploy.yml: $missing"
            exit 1
          fi
      - name: Check the results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # The deploy job's own result counts only through its build step; the Android preview and the sync Worker
          # deploy don't count; a skipped job passes.
          bad=$(echo "$NEEDS" | jq -r '
            to_entries[]
            | select(.key != "android-preview" and .key != "deploy-sync")
            | select(if .key == "deploy" then .value.outputs.build != "success"
                     else .value.result == "failure" or .value.result == "cancelled" end)
            | .key')
          if [ -n "$bad" ]; then
            echo "::error::Failed or cancelled: $bad"
            exit 1
          fi
