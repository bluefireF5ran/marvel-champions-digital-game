name: Release on Merge to Main

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump level (auto, patch, minor, major)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      publish:
        description: "Publish immediately (false = draft release)"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write
  # scripts/release-credits.mjs lists issues for the README's Special thanks; without this the list comes back empty.
  issues: read

concurrency:
  group: release-on-merge-${{ github.ref }}
  cancel-in-progress: false

# Three stages. `decide` works out what this run does; `checks` (lint, format, build) and `tests` (tests.yml: a
# typecheck and the unit tests, in parallel) gate it; `check-and-cut-release` then opens the release PR or tags the
# release, and the desktop and Android jobs after it only build. A run with nothing to release stops after `decide`.
jobs:
  decide:
    name: Check Changes
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.check_changes.outputs.mode }}
      has_changes: ${{ steps.check_changes.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch all git tags
        run: git fetch --tags --force

      - name: Setup Changie
        uses: miniscruff/changie-action@v3
        with:
          version: latest

      # main requires a pull request (the "default" ruleset), so this job never pushes to main. It runs in one of
      # two modes:
      #   prepare: unreleased fragments on main -> batch them onto the bot-owned `release/next` branch and open or
      #            update a "chore(release): vX.Y.Z" PR.
      #   tag:     that PR has merged, so main's latest `.changes/vX.Y.Z.md` has no tag yet -> tag it and build.
      - name: Decide what this run does
        id: check_changes
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "Tag push detected (${GITHUB_REF_NAME})."
            printf 'mode=tag\nhas_changes=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LATEST=$(changie latest)
          COUNT=$(find .changes/unreleased -maxdepth 1 \( -name "*.yaml" -o -name "*.yml" \) 2>/dev/null | wc -l)
          echo "Latest released version on main: ${LATEST}. Unreleased fragments: ${COUNT}."

          # Ask for the one tag rather than piping every tag into `grep -q`: Actions runs bash with pipefail, so grep
          # quitting at its first match could fail the pipe on SIGPIPE and read as "not tagged" (a run then tried to
          # tag v0.28.0 again and failed).
          if [ -z "$(git ls-remote --tags origin "refs/tags/${LATEST}")" ]; then
            echo "${LATEST} is on main but not tagged: its release PR merged. Tagging it."
            printf 'mode=tag\nhas_changes=true\n' >> "$GITHUB_OUTPUT"
          elif [ "${COUNT}" -gt 0 ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            printf 'mode=prepare\nhas_changes=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'has_changes=false\nshould_release=false\n' >> "$GITHUB_OUTPUT"
          fi

  checks:
    name: Checks (lint, format, build)
    needs: decide
    if: needs.decide.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm fmt:check
      - run: pnpm build

  tests:
    name: Tests
    needs: decide
    if: needs.decide.outputs.has_changes == 'true'
    uses: ./.github/workflows/tests.yml

  check-and-cut-release:
    name: Cut Release
    needs: [decide, checks, tests]
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.cut.outputs.should_release }}
      version: ${{ steps.cut.outputs.version }}
      tag: ${{ steps.cut.outputs.tag }}
      publish: ${{ steps.cut.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch all git tags
        run: git fetch --tags --force

      - name: Setup Changie
        uses: miniscruff/changie-action@v3
        with:
          version: latest

      - name: Open or update the release PR
        id: prepare
        if: needs.decide.outputs.mode == 'prepare'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUMP_INPUT: ${{ github.event.inputs.bump || 'auto' }}
        run: |
          if [ "${BUMP_INPUT}" != "auto" ]; then
            NEXT_TAG=$(changie next "${BUMP_INPUT}")
          else
            NEXT_TAG=$(changie next auto 2>/dev/null || changie next patch)
          fi
          TAG="v${NEXT_TAG#v}"
          PREV_TAG=$(git describe --tags --abbrev=0 --match "v*")
          echo "Preparing ${TAG}."

          # Batch the fragments into .changes/${TAG}.md, rebuild CHANGELOG.md and run the version replacements
          # (.changie.yaml), then bump Android's versionCode.
          changie batch "${TAG}" --allow-no-changes
          changie merge
          GRADLE_FILE="packages/client/android/app/build.gradle"
          if [ -f "$GRADLE_FILE" ]; then
            CURRENT_CODE=$(grep -oE 'versionCode [0-9]+' "$GRADLE_FILE" | awk '{print $2}')
            sed -i -E "s/versionCode [0-9]+/versionCode $((CURRENT_CODE + 1))/" "$GRADLE_FILE"
          fi

          # release/next is owned by this job and rebuilt from main on every run, so it is force-pushed.
          # The repo's pre-push hook runs the whole Playwright suite. That gate is for contributors' pushes; this
          # commit only batches changelog fragments onto code main already has. This job doesn't run `pnpm install`,
          # so the hooks aren't installed here, and `--no-verify` keeps it that way if that ever changes.
          # The README's Special thanks lists, refreshed from every issue and merged PR (scripts/release-credits.mjs).
          node scripts/release-credits.mjs readme || echo "::warning::Couldn't refresh the README's Special thanks."

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B release/next
          git add -A
          git commit --no-verify -m "chore(release): ${TAG}"
          git push --no-verify --force origin release/next

          BODY_FILE=$(mktemp)
          {
            echo "Merging this PR releases **${TAG}**: the tag, the GitHub release, and the desktop and Android builds."
            echo "It is regenerated on every merge to main while it is open, so it always holds everything unreleased."
            echo
            cat ".changes/${TAG}.md"
            node scripts/release-credits.mjs notes "${PREV_TAG}" HEAD "${TAG}" ||
              echo "::warning::Couldn't list this release's Special thanks." >&2
          } > "$BODY_FILE"

          PR=$(gh pr list --head release/next --base main --state open --json number -q '.[0].number')
          if [ -n "$PR" ]; then
            gh pr edit "$PR" --title "chore(release): ${TAG}" --body-file "$BODY_FILE"
            echo "Updated release PR #${PR}."
          else
            gh pr create --head release/next --base main --title "chore(release): ${TAG}" --body-file "$BODY_FILE"
          fi

      - name: Tag the release
        id: cut
        if: needs.decide.outputs.mode == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_INPUT: ${{ github.event.inputs.publish || 'true' }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG=$(changie latest)
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" -m "Release ${TAG}"
            git push --no-verify origin "${TAG}"
          fi
          VERSION="${TAG#v}"
          echo "Releasing ${TAG}."

          # The changelog, a Special thanks to everyone who reported or wrote this release's changes
          # (scripts/release-credits.mjs), then a "Which download do I need?" table naming this version's files.
          NOTES_FILE=""
          if [ -f ".changes/${TAG}.md" ]; then
            NOTES_FILE="$(mktemp)"
            PREV_TAG=$(git describe --tags --abbrev=0 --match "v*" "${TAG}^")
            CREDITS=$(node scripts/release-credits.mjs notes "${PREV_TAG}" "${TAG}") ||
              { echo "::warning::Couldn't list this release's Special thanks."; CREDITS=""; }
            {
              cat ".changes/${TAG}.md"
              if [ -n "$CREDITS" ]; then printf '%s\n' "$CREDITS"; fi
              sed "s/VERSION/${VERSION}/g" .github/release-downloads.md
            } > "$NOTES_FILE"
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists on GitHub."
            if [ -n "$NOTES_FILE" ]; then gh release edit "${TAG}" --notes-file "$NOTES_FILE"; fi
          else
            GH_ARGS=(release create "${TAG}" --title "Marvel Champions ${TAG}" --draft --prerelease)
            if [ -n "$NOTES_FILE" ]; then GH_ARGS+=(--notes-file "$NOTES_FILE"); else GH_ARGS+=(--generate-notes); fi
            gh "${GH_ARGS[@]}"
          fi

          {
            echo "should_release=true"
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "publish=${PUBLISH_INPUT}"
          } >> "$GITHUB_OUTPUT"

  desktop-builds:
    name: Desktop (${{ matrix.name }})
    needs: check-and-cut-release
    if: needs.check-and-cut-release.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One build per architecture, not a universal binary: Tauri embeds the whole of `dist/` (card art and
          # music, over a gigabyte) in the executable, so a universal binary carries it twice and its .dmg passes
          # GitHub's 2 GiB limit on a release asset (v0.16.0).
          - name: macOS (Apple silicon)
            os: macos-latest
            artifact: macos-aarch64
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            artifact: macos-x64
            args: --target x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
          - name: Linux (x86_64)
            os: ubuntu-22.04
            artifact: linux-x64
            args: ""
            rust-targets: ""
          - name: Windows 11 (x64)
            os: windows-latest
            artifact: windows-x64
            args: ""
            rust-targets: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-and-cut-release.outputs.tag }}

      - name: Linux build dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential curl wget file libssl-dev libxdo-dev

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/client/src-tauri -> target
          # The two macOS builds share an OS but not a target, so each keeps its own cache.
          key: ${{ matrix.artifact }}

      - run: pnpm install --frozen-lockfile

      # Signs and notarizes the macOS bundle once the Apple secrets exist (see
      # README, "macOS signing"). Only the secrets that are set are exported:
      # Tauri treats an empty APPLE_CERTIFICATE or APPLE_ID as present and
      # fails, so with no secrets the build stays unsigned, as before.
      - name: macOS signing secrets
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!name}" ]; then
              delim="EOF_$(uuidgen)"
              { echo "$name<<$delim"; echo "${!name}"; echo "$delim"; } >> "$GITHUB_ENV"
              echo "$name is set"
            fi
          done

      # Names the certificate in the log (subject, issuer, expiry) and checks it
      # against APPLE_SIGNING_IDENTITY, so a wrong .p12 fails here with a reason
      # instead of as "failed to resolve signing identity". It also installs
      # Apple's Developer ID G2 intermediate, without which the runner cannot
      # validate a certificate exported without its chain.
      - name: macOS certificate check
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        run: |
          P12="$RUNNER_TEMP/cert.p12"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$P12"
          SUBJECT=$(/usr/bin/openssl pkcs12 -in "$P12" -clcerts -nokeys -passin env:APPLE_CERTIFICATE_PASSWORD \
            | /usr/bin/openssl x509 -noout -subject -issuer -enddate) || SUBJECT=""
          rm -f "$P12"
          if [ -z "$SUBJECT" ]; then
            echo "::error::APPLE_CERTIFICATE could not be read with APPLE_CERTIFICATE_PASSWORD."
            exit 1
          fi
          echo "$SUBJECT"
          case "$SUBJECT" in
            *"Developer ID Application:"*) ;;
            *) echo "::error::APPLE_CERTIFICATE is not a Developer ID Application certificate."; exit 1 ;;
          esac
          case "$SUBJECT" in
            *"$APPLE_SIGNING_IDENTITY"*) ;;
            *) echo "::error::APPLE_SIGNING_IDENTITY does not match the certificate's name (CN above)."; exit 1 ;;
          esac
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          sudo security add-certificates -k /Library/Keychains/System.keychain "$RUNNER_TEMP/DeveloperIDG2CA.cer" || true

      - name: Build Tauri desktop bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VSCMD_SKIP_SENDTELEMETRY: "1"
        with:
          projectPath: packages/client
          args: ${{ matrix.args }}

      # tauri-action only builds (no tagName): the release names each file itself, after its OS, architecture and kind
      # of installer (scripts/lib/release-collector.mjs), which tauri-action's one-pattern-per-build naming can't do
      # (the .msi and the setup.exe of one build need different names).
      - name: Stage release assets under their release names
        run: node scripts/stage-release-assets.mjs

      - name: Upload to the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.check-and-cut-release.outputs.tag }}" release/* --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: marvel-champions-${{ matrix.artifact }}
          if-no-files-found: warn
          path: release/*

  android-build:
    name: Android Release APK
    needs: check-and-cut-release
    if: needs.check-and-cut-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-and-cut-release.outputs.tag }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - run: pnpm install --frozen-lockfile

      # A supplied keystore needs its password: a missing secret fails here
      # rather than being guessed. With no keystore at all, CI signs with a
      # throwaway key and a random password, so that APK will not install over
      # one signed with the real key.
      - name: Setup Keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.ANDROID_KEYSTORE_ALIAS || 'marvel-champions' }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            if [ -z "$KEYSTORE_PASSWORD" ]; then
              echo "::error::ANDROID_KEYSTORE_BASE64 is set but ANDROID_KEYSTORE_PASSWORD is not. Add it as a repository secret (an environment secret is not visible to this job)."
              exit 1
            fi
            echo "$KEYSTORE_BASE64" | base64 -d > marvel-champions.keystore
            echo "Decoded keystore from repository secret."
          else
            KEYSTORE_PASSWORD="$(openssl rand -hex 24)"
            KEY_PASSWORD=""
            echo "::add-mask::$KEYSTORE_PASSWORD"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret; signing with a throwaway CI key."
            keytool -genkeypair -v -keystore marvel-champions.keystore \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
              -dname "CN=Marvel Champions, OU=Game, O=Digital, L=Unknown, ST=Unknown, C=US"
          fi
          {
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            echo "ANDROID_KEYSTORE_ALIAS=$KEY_ALIAS"
          } >> "$GITHUB_ENV"

      # Passwords and alias come from the Setup Keystore step's GITHUB_ENV.
      - name: Build Android Release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/marvel-champions.keystore
          # The production save-transfer Worker (save-data/transfer-config.ts); empty until the variable is set.
          VITE_SYNC_URL: >-
            ${{ (vars.CLOUDFLARE_WORKERS_SUBDOMAIN || secrets.CLOUDFLARE_WORKERS_SUBDOMAIN) && format('https://mc-sync.{0}.workers.dev',
            (vars.CLOUDFLARE_WORKERS_SUBDOMAIN || secrets.CLOUDFLARE_WORKERS_SUBDOMAIN)) || '' }}
        run: pnpm android:build

      - name: Upload APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.check-and-cut-release.outputs.tag }}"
          APK_FILE=$(find dist/android release -name "*.apk" 2>/dev/null | head -n 1)
          if [ -f "$APK_FILE" ]; then
            echo "Uploading ${APK_FILE} to release ${TAG}..."
            gh release upload "${TAG}" "${APK_FILE}" --clobber
          else
            echo "ERROR: Release APK not found."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: marvel-champions-android
          if-no-files-found: warn
          path: |
            release/*.apk

  finalize-release:
    name: Finalize Release Manifest
    needs: [check-and-cut-release, desktop-builds, android-build]
    if: needs.check-and-cut-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-and-cut-release.outputs.tag }}

      - name: Download all assets and generate SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.check-and-cut-release.outputs.tag }}"
          mkdir -p release-assets
          gh release download "${TAG}" --dir release-assets

          cd release-assets
          rm -f SHA256SUMS.txt
          FILES=$(find . -maxdepth 1 -type f ! -name "SHA256SUMS.txt")
          if [ -n "$FILES" ]; then
            sha256sum $FILES > SHA256SUMS.txt
            cat SHA256SUMS.txt
            echo "Uploading SHA256SUMS.txt..."
            gh release upload "${TAG}" SHA256SUMS.txt --clobber
          else
            echo "Warning: No release assets found to checksum."
          fi

      - name: Publish Release
        if: needs.check-and-cut-release.outputs.publish != 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.check-and-cut-release.outputs.tag }}"
          echo "Publishing release ${TAG}..."
          gh release edit "${TAG}" --draft=false --prerelease=false --latest
