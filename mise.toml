# Toolchain and task runner for Marvel Champions: Digital Edition.
#
# Tasks delegate to the package.json scripts rather than restating the commands,
# so there is one definition of each and nothing to drift. Run `mise tasks` to
# list them, or use the pnpm scripts directly — they are the same thing.

[tools]
go = "latest"
pnpm = "11.24"
uv = "0.12.11"
node = "24"
# The desktop build (Tauri) needs cargo on PATH; mise drives it through rustup.
rust = "stable"
# Android Gradle and Capacitor require Java 21
java = "temurin-21"
gradle = "latest"
changie = "latest"
actionlint = "latest"
github-cli = "latest"

[tasks.setup]
description = "Install workspace dependencies"
run = "pnpm install"

[tasks.dev]
description = "Run the game client on http://localhost:5173"
run = "pnpm dev"

[tasks.preview]
description = "Build the client and serve the production bundle"
run = "pnpm preview"

[tasks.build]
description = "Build every package (content → engine → cards → client)"
run = "pnpm build"

[tasks.test]
description = "Run every package's Vitest suite"
run = "pnpm test"

[tasks.typecheck]
description = "Typecheck every package"
run = "pnpm typecheck"

[tasks.lint]
description = "Lint every package with oxlint (.oxlintrc.json). `mise run lint -- --fix` applies the safe fixes"
run = "pnpm lint"

[tasks.fmt]
description = "Format the whole tree with oxfmt (.oxfmtrc.json). `mise run fmt-check` only reports"
run = "pnpm fmt"

[tasks.fmt-check]
description = "Report files oxfmt would change, without writing"
run = "pnpm fmt:check"

[tasks.check]
description = "Everything CI runs: lint, format check, YAML lint, changelog fragments, typecheck, then tests, then build"
# A sequential array, so a failure stops the run and the output stays readable.
# The pre-commit hook (.githooks/pre-commit, installed by `pnpm install`) runs the
# first two on the staged files only; this runs them over the whole tree.
run = [
  "pnpm lint",
  "pnpm fmt:check",
  "pnpm yaml:lint",
  "pnpm changelog:check",
  "pnpm typecheck",
  "pnpm test",
  "pnpm build",
]

[tasks.yaml-lint]
description = "Lint every YAML file with yamllint (.yamllint.yaml)"
run = "pnpm yaml:lint"

[tasks.changelog-check]
description = "Lint the unreleased changelog fragments the way the release job reads them"
run = "pnpm changelog:check"

[tasks.ingest]
description = "Regenerate card data. Pass flags after --, e.g. mise run ingest -- --pack core --offline"
run = "pnpm ingest"

[tasks.scrape-campaigns]
description = "Convert campaign mode PDFs to AI-ready Markdown"
run = "uv run scripts/scrape_campaign_markdown.py"

[tasks.card-art-compress]
description = "Re-encode new card scans in assets/card-art as WebP (q72). Already-WebP scans are skipped; --dry-run reports only"
run = "pnpm card-art:compress"

[tasks.clean]
description = "Remove every package's build output"
run = "pnpm clean"

# Sequential arrays rather than `a && b`: mise runs inline tasks through sh on macOS/Linux and cmd.exe on
# Windows, and an array is the one form that means "stop at the first failure" in both.

[tasks.start]
description = "Clean Start"
run = ["mise run clean", "mise run build", "mise run preview"]

[tasks.start-dev]
description = "Clean Start Dev Build"
run = ["mise run clean", "mise run build", "mise run dev"]

[tasks.ship-it]
description = "Build all release assets (desktop installers + Android APK) into release/, create git tag, and draft/publish GitHub release"
run = "node scripts/ship-it.mjs"
