[build]
command = "pnpm --filter @mc/client build"
publish = "packages/client/dist"
# Our own pushes and PRs deploy from GitHub Actions (netlify-deploy.yml), which costs no Netlify build minutes. Netlify
# builds only deploy previews for PRs from forks, which get no Actions secrets. Exit 0 skips the build.
ignore = "node -e \"if(process.env.PULL_REQUEST!=='true')process.exit(0);fetch('https://api.github.com/repos/quincarter/marvel-champions-digital-game/pulls/'+process.env.REVIEW_ID).then(r=>r.json()).then(p=>process.exit(p.head&&p.head.repo&&p.head.repo.fork?1:0)).catch(()=>process.exit(0))\""

[build.environment]
NODE_VERSION = "24"

# Proxy MarvelCDB deck imports directly through Netlify CDN
[[redirects]]
from = "/api/marvelcdb-import/decklist/:id"
to = "https://marvelcdb.com/api/public/decklist/:id.json"
status = 200
force = true

[[redirects]]
from = "/api/marvelcdb-import/deck/:id"
to = "https://marvelcdb.com/api/public/deck/:id.json"
status = 200
force = true

# SPA client-side routing fallback
[[redirects]]
from = "/*"
to = "/index.html"
status = 200

# Cache static card scans on Netlify's global edge CDN
[[headers]]
for = "/card-art/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

# The other card languages the web build carries (issue #337)
[[headers]]
for = "/card-art-es/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

# English, when a Spanish preview makes Spanish the build language
[[headers]]
for = "/card-art-en/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

# Cache hashed Vite assets (JS, CSS, fonts, audio)
[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
