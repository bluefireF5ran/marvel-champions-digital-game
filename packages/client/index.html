<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Marvel Champions</title>
    <!--
      The only DOM in the app. Phaser draws every screen (PLAN.md Phase 4), so
      this page exists to host the canvas and nothing else. VOID (#0E0C0A) is
      the design system's canvas-behind-screens colour, so the page never
      flashes white before the game boots.
    -->
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #0e0c0a;
        color-scheme: dark;
      }
      /*
        The game sits inside the safe area, so a notch, a Dynamic Island or the
        home indicator never covers a control; VOID fills the insets. The insets
        are only non-zero with viewport-fit=cover, which main.ts adds in a
        native shell or an installed app (platform.ts#applyViewportFit). With
        Phaser's RESIZE scale mode the canvas takes this box's size, so scenes
        lay out against the safe rect with no inset logic of their own. Every
        inset is 0 on desktop, so this is the whole-window box there.
      */
      #game {
        position: fixed;
        top: env(safe-area-inset-top, 0px);
        right: env(safe-area-inset-right, 0px);
        bottom: env(safe-area-inset-bottom, 0px);
        left: env(safe-area-inset-left, 0px);
      }
      /*
        Press-and-hold is the game's Inspect gesture, so the browser's own
        long-press behaviours have to stay out of it: on iOS and Android a held
        finger otherwise starts a text selection, a callout or a magnifier and
        the page gets a `touchcancel` instead of the rest of the hold. Canvas
        only: the one DOM text field (`McTextInput`) must stay selectable.
      */
      canvas {
        display: block;
        touch-action: none;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <!--
      Issue #157: the last-resort report when the game never reaches a screen. A plain script, written for the oldest
      browser, so it runs even when the game's module cannot load or parse; `ui/startup-watchdog.ts` moves
      `__mcBoot.stage` along (page, module, game, frame, screen) and covers the failures it can see itself.
    -->
    <script>
      (function () {
        var boot = (window.__mcBoot = { stage: "page", errors: [] });
        window.addEventListener("error", function (event) {
          boot.errors.push(String((event.error && event.error.message) || event.message));
        });
        setTimeout(function () {
          if (boot.stage === "screen" || document.getElementById("mc-startup-failure")) return;
          var panel = document.createElement("div");
          panel.id = "mc-startup-failure";
          panel.setAttribute("role", "alert");
          panel.style.cssText =
            "position:fixed;top:0;right:0;bottom:0;left:0;z-index:10;overflow:auto;padding:24px 16px;" +
            "background:#0e0c0a;color:#f3ead8;font:14px/1.5 monospace;white-space:pre-wrap;word-break:break-word";
          panel.textContent = [
            "The game did not start.",
            "Reached: " + boot.stage,
            boot.errors.length ? "Errors: " + boot.errors.slice(-5).join(" | ") : "Errors: none",
            "Screen: " +
              window.innerWidth +
              "x" +
              window.innerHeight +
              " at device pixel ratio " +
              window.devicePixelRatio,
            "Browser: " + navigator.userAgent,
          ].join("\n");
          document.body.appendChild(panel);
        }, 30000);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
