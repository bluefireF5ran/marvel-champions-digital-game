[package]
name = "marvel-champions"
version = "0.37.0"
description = "Marvel Champions: Digital Edition (desktop shell)"
authors = ["Quin Carter"]
license = "AGPL-3.0-or-later"
repository = ""
edition = "2021"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "marvel_champions_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# Tauri's default features minus `compression`: it brotli-compresses all of
# dist/ (136 MB, mostly already-compressed card art and audio) at quality 9 on
# every release compile, minutes per build and twice for macOS universal.
tauri = { version = "2.12.3", default-features = false, features = [
  "wry",
  "common-controls-v6",
  "dynamic-acl",
  "x11",
  "dbus",
] }
tauri-plugin-log = "2"
tauri-plugin-http = "2.8.2"
tauri-plugin-opener = "2"
# The desktop Save dialog for exporting save data (src/save_file.rs).
tauri-plugin-dialog = "2"
# Discord Rich Presence over the local IPC socket (src/discord_presence.rs).
discord-rich-presence = "1.1"

# Exclusive fullscreen: switching the monitor's display mode (src/display_mode.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
] }
# The game's own volume in the Windows volume mixer (src/app_volume.rs): Core Audio's COM interfaces.
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Variant",
  "Win32_UI_Shell",
] }

# Native gamepads on Linux (src/gamepad_bridge.rs): WebKitGTK's Gamepad API misreads common pads, so gilrs reads them
# through evdev with SDL_GameControllerDB mappings. Needs libudev-dev to build (libudev-sys).
[target.'cfg(target_os = "linux")'.dependencies]
gilrs = "0.11.2"

# The Linux app plays its own music and effects (src/native_audio*.rs): WebKitGTK's Web Audio crackled on the Steam
# Deck. symphonia decodes the mp3s; libpulse talks to PulseAudio / PipeWire's pulse server. Needs libpulse-dev to build.
symphonia = { version = "0.5", default-features = false, features = ["mp3"] }
libpulse-binding = "2.28"
libpulse-simple-binding = "2.28"
# The page-hang watchdog (src/hang_watchdog.rs) restarts WebKitGTK's web process. Pinned to exactly the version wry
# pins (wry 0.57's own `webkit2gtk = "=2.0.2"`, see Cargo.lock): a Tauri/wry bump that moves it needs this line moved too,
# or the two versions conflict and the Linux build fails.
webkit2gtk = { version = "=2.0.2", features = ["v2_34"] }

# The engine's tests run on every host (the engine itself is Linux-only in the app).
[dev-dependencies]
symphonia = { version = "0.5", default-features = false, features = ["mp3"] }
