[package]
name = "marvel-champions"
version = "0.35.1"
description = "Marvel Champions: Digital Edition (desktop shell)"
authors = ["Quin Carter"]
license = "AGPL-3.0-or-later"
repository = ""
edition = "2021"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "marvel_champions_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# Tauri's default features minus `compression`: it brotli-compresses all of
# dist/ (136 MB, mostly already-compressed card art and audio) at quality 9 on
# every release compile, minutes per build and twice for macOS universal.
tauri = { version = "2.12.3", default-features = false, features = [
  "wry",
  "common-controls-v6",
  "dynamic-acl",
  "x11",
  "dbus",
] }
tauri-plugin-log = "2"
tauri-plugin-http = "2.8.2"
tauri-plugin-opener = "2"
# The desktop Save dialog for exporting save data (src/save_file.rs).
tauri-plugin-dialog = "2"

# Exclusive fullscreen: switching the monitor's display mode (src/display_mode.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
] }
# The game's own volume in the Windows volume mixer (src/app_volume.rs): Core Audio's COM interfaces.
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Variant",
  "Win32_UI_Shell",
] }
