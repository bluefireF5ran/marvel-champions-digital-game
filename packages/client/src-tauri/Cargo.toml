[package]
name = "marvel-champions"
version = "0.21.0"
description = "Marvel Champions: Digital Edition (desktop shell)"
authors = ["Quin Carter"]
license = "AGPL-3.0-or-later"
repository = ""
edition = "2021"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "marvel_champions_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# Tauri's default features minus `compression`: it brotli-compresses all of
# dist/ (136 MB, mostly already-compressed card art and audio) at quality 9 on
# every release compile, minutes per build and twice for macOS universal.
tauri = { version = "2.12.3", default-features = false, features = [
  "wry",
  "common-controls-v6",
  "dynamic-acl",
  "x11",
  "dbus",
] }
tauri-plugin-log = "2"
tauri-plugin-http = "2.8.2"
tauri-plugin-opener = "2"
